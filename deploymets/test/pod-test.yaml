apiVersion: v1
kind: Pod
metadata:
  name: zfs-test-pod
  namespace: default
spec:
  containers:
  - name: app
    image: ubuntu:22.04
    command: ["/bin/sh", "-c", "while true; do echo $(date) >> /mnt/data/log.txt; sleep 5; done"]
    volumeMounts:
    - mountPath: /mnt/data
      name: zfs-volume
  volumes:
  - name: zfs-volume
    persistentVolumeClaim:
      claimName: zfs-pvc
